<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AOC Obstacle Measurement Tool</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --border: rgba(0, 0, 0, 0.12);
      --text: #1a1a18;
      --muted: #6b6b66;
      --hint: #9b9b96;
      --blue: #185FA5;
      --blue-bg: #E6F1FB;
      --blue-text: #0C447C;
      --green: #0F6E56;
      --green-bg: #E1F5EE;
      --green-text: #085041;
      --amber: #854F0B;
      --amber-bg: #FAEEDA;
      --amber-text: #633806;
      --red: #993C1D;
      --red-bg: #FAECE7;
      --red-text: #712B13;
      --radius: 8px;
      --radius-lg: 12px;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Layout */
    #app {
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: 48px 1fr;
      height: 100vh;
    }

    #topbar {
      grid-column: 1/-1;
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
    }

    #sidebar {
      background: var(--surface);
      border-right: 0.5px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    #canvas-area {
      position: relative;
      overflow: hidden;
      background: #2a2a28;
    }

    /* Topbar */
    #topbar h1 {
      font-size: 14px;
      font-weight: 500;
    }

    #topbar .sep {
      width: 0.5px;
      height: 20px;
      background: var(--border);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 400;
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.1s;
    }

    .btn:hover {
      background: var(--bg);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn.primary {
      background: var(--blue-bg);
      color: var(--blue-text);
      border-color: rgba(24, 95, 165, 0.3);
    }

    .btn.active {
      background: var(--blue-bg);
      color: var(--blue-text);
      border-color: var(--blue);
      font-weight: 500;
    }

    .btn.success {
      background: var(--green-bg);
      color: var(--green-text);
      border-color: rgba(15, 110, 86, 0.3);
    }

    .btn.danger {
      background: var(--red-bg);
      color: var(--red-text);
      border-color: rgba(153, 60, 29, 0.3);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer;
      font-size: 14px;
      color: var(--muted);
    }

    .icon-btn:hover {
      background: var(--bg);
      color: var(--text);
    }

    /* Sidebar sections */
    .s-section {
      padding: 12px 14px;
      border-bottom: 0.5px solid var(--border);
    }

    .s-title {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    /* Upload zone */
    /*#upload-zone { border: 1.5px dashed var(--border); border-radius: var(--radius-lg); padding: 20px 12px; text-align: center; cursor: pointer; transition: all 0.15s; }
  #upload-zone:hover, #upload-zone.drag { border-color: var(--blue); background: var(--blue-bg); }
  #upload-zone svg { display: block; margin: 0 auto 8px; color: var(--hint); }
  #upload-zone p { font-size: 12px; color: var(--muted); }
  #upload-zone .sub { font-size: 11px; color: var(--hint); margin-top: 2px; }
  #file-input { display: none; }
*/

    /* Calibration */
    .calib-step {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 0;
    }

    .step-num {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--amber-bg);
      color: var(--amber-text);
      font-size: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .step-num.done {
      background: var(--green-bg);
      color: var(--green-text);
    }

    .step-text {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    /* Mode buttons */
    .mode-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* Stats */
    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .stat-card {
      background: var(--bg);
      border-radius: var(--radius);
      padding: 8px 10px;
    }

    .stat-card .label {
      font-size: 10px;
      color: var(--hint);
    }

    .stat-card .val {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      margin-top: 1px;
    }

    /* Obstacle table */
    #obs-table-wrap {
      flex: 1;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th {
      padding: 6px 8px;
      text-align: left;
      font-weight: 400;
      color: var(--muted);
      border-bottom: 0.5px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--surface);
      font-size: 11px;
    }

    td {
      padding: 5px 8px;
      border-bottom: 0.5px solid var(--border);
    }

    td input {
      width: 60px;
      border: 0.5px solid var(--border);
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 11px;
      background: var(--bg);
      color: var(--text);
    }

    td input:focus {
      outline: none;
      border-color: var(--blue);
    }

    tbody tr:hover {
      background: var(--bg);
    }

    .obs-id {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--red-bg);
      color: var(--red-text);
      font-size: 10px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Hint bar */
    #hint-bar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(26, 26, 24, 0.82);
      color: #fff;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
      backdrop-filter: blur(4px);
      transition: opacity 0.2s;
    }

    /* Zoom controls */
    #zoom-controls {
      position: absolute;
      bottom: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
    }

    /* Canvas cursor states */
    #main-canvas {
      display: block;
      cursor: crosshair;
      transform-origin: 0 0;
    }

    #main-canvas.grab {
      cursor: grab;
    }

    #main-canvas.grabbing {
      cursor: grabbing;
    }

    /* Scale badge */
    #scale-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(26, 26, 24, 0.7);
      color: #fff;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      pointer-events: none;
      z-index: 10;
    }

    /* Coord display */
    #coord-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(26, 26, 24, 0.7);
      color: #fff;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      pointer-events: none;
      z-index: 10;
    }

    /* Toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 12px;
    }

    .toggle {
      position: relative;
      width: 28px;
      height: 16px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle input:checked+.toggle-track {
      background: var(--blue);
    }

    .toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
      pointer-events: none;
    }

    .toggle input:checked~.toggle-thumb {
      transform: translateX(12px);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .flex-container1 {
      display: flex;
      /* Aligns items side by side */
      gap: 20px;
      /* Adds space between the two divs */
    }

    .box1 {
      flex: 1;
      /* Forces both divs to take up equal width */
      padding: 15px;
      background-color: #f0f0f0;
    }

    .flash-bg {
      cursor: pointer;
      animation: flashBackground 1s infinite linear;
    }

    @keyframes flashBackground {

      0%,
      100% {
        background-color: #f5f4f0;
      }

      50% {
        background-color: #EED202;
      }
    }
  </style>
</head>

<body>
  <div id="app">

    <!-- Top bar -->
    <div id="topbar">
      <h1>AOC Obstacle Measurement Tool</h1>
      <div class="sep"></div>
      <button class="btn flash-bg" id="btn-upload" onclick="document.getElementById('file-input').click()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
        Upload chart
      </button>
      <input type="file" id="file-input" accept="image/*" onchange="loadChart(event)" style="display: none;">
      <div class="sep"></div>
      <button class="btn" id="btn-export" onclick="exportCSV()" disabled style="background:#90EE90">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        Export CSV
      </button>
      <button class="btn" id="downloadBtn" onclick="exportCanvas()" disabled style="background:#90EE90">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        Download Image
      </button>
      <button class="btn danger" onclick="resetAll()" style="margin-left:auto">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="1 4 1 10 7 10" />
          <path d="M3.51 15a9 9 0 102.13-9.36L1 10" />
        </svg>
        Reset
      </button>
    </div>

    <!-- Sidebar -->
    <div id="sidebar">
      <!-- Upload -->
      <!-- 
    <div class="s-section">
      <div class="s-title"></div>
      <div id="upload-zone"
        onclick="document.getElementById('file-input').click()"
        ondragover="e=>{ e.preventDefault(); this.classList.add('drag')}"
        ondragleave="this.classList.remove('drag')"
        ondrop="onDrop(event)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <p>Drop or click to upload</p>
        <p class="sub">PNG · JPG · Plan or profile view</p>
      </div>
      <div id="chart-info" style="display:none;margin-top:8px;font-size:11px;color:var(--muted);"></div>
    </div>
    -->
      <div class="s-section">
        <div class="s-title">Confirm takeoff direction</div>
        <div class="flex-container1">
          <div class="step-text" style="padding-top:6px; padding-bottom:6px">
            <label for="Takeoff Direction" style="margin-left:10px; ">Takeoff Direction:</label>
            <select class="step-text" name="to-dir" id="to-dir" disabled
              style="border:0.5px solid var(--border);border-radius:var(--radius);padding:4px 6px;font-size:12px;background:var(--bg);color:var(--text);">
              <option value="left">Left</option>
              <option value="right">Right </option>
            </select>
            <button class="btn active" id="btn-confirm-dir" disabled onclick="confirmDirection()">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="5" y1="12" x2="19" y2="12" />
                <line x1="5" y1="5" x2="5" y2="19" />
                <line x1="19" y1="5" x2="19" y2="19" />
              </svg>
              Confirm
            </button>
          </div>
        </div>
      </div>

      <!-- Calibration -->
      <div class="s-section">
        <div class="flex-container1">
          <div class="s-title">Scale calibration</div>
          <div title="Click the start and end of a known distance on the printed scale bar." class="step-num"
            id="step1-num">i</div>
        </div>
        <div class="calib-step">
          <div>
            <!--<div style="font-size:12px;font-weight:500;margin-bottom:2px">Click two scale bar points</div> -->
            <div class="step-text" title="Click the start and end of a known distance on the printed scale bar.">
              Calibrate to begin.</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin:6px 0 4px;padding-left:26px;">
          <input type="number" id="calib-dist" value="1000" min="1" step="1"
            style="width:70px;border:0.5px solid var(--border);border-radius:var(--radius);padding:4px 7px;font-size:12px;background:var(--bg);color:var(--text);">
          <select id="calib-unit"
            style="border:0.5px solid var(--border);border-radius:var(--radius);padding:4px 6px;font-size:12px;background:var(--bg);color:var(--text);">
            <option value="m">metres</option>
            <option value="ft">feet</option>
            <option value="nm">NM</option>
          </select>
        </div>
        <div style="padding-left:10px;">
          <button class="btn active" id="btn-calib" onclick="setMode('calibrate')" disabled>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12" />
              <line x1="5" y1="5" x2="5" y2="19" />
              <line x1="19" y1="5" x2="19" y2="19" />
            </svg>
            Calibrate
          </button>
        </div>
        <div id="calib-result"
          style="display:none;margin-top:8px;padding:6px 10px;background:var(--green-bg);border-radius:var(--radius);font-size:11px;color:var(--green-text);padding-left:26px;margin-left:0;">
        </div>
      </div>

      <!-- Measurement mode -->
      <div class="s-section">
        <div class="s-title">Measurement</div>
        <div class="mode-group">
          <button class="btn" id="btn-rwy" onclick="setMode('runway')" disabled>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 20L20 4" />
              <path d="M20 4h-6" />
              <path d="M20 4v6" />
            </svg>
            Set runway end
          </button>
          <button class="btn" id="btn-obs" onclick="setMode('obstacle')" disabled>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="10" r="3" />
              <path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 10-16 0c0 3 2.7 6.9 8 11.7z" />
            </svg>
            Place obstacle
          </button>
          <button class="btn" onclick="undoLast()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 14 4 9 9 4" />
              <path d="M20 20v-7a4 4 0 00-4-4H4" />
            </svg>
            Undo last
          </button>
        </div>
      </div>

      <!-- Display toggles -->
      <div class="s-section">
        <div class="s-title">Display Options</div>
        <div class="toggle-row">
          <span>Dimension lines</span>
          <label class="toggle"><input type="checkbox" id="tog-dims" checked onchange="draw()">
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
          </label>
        </div>
        <div class="toggle-row">
          <span>Distance labels</span>
          <label class="toggle"><input type="checkbox" id="tog-labels" checked onchange="draw()">
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
          </label>
        </div>
        <div class="toggle-row">
          <span>Obstacle IDs</span>
          <label class="toggle"><input type="checkbox" id="tog-ids" checked onchange="draw()">
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
          </label>
        </div>
      </div>

      <!-- Obstacle Table -->
      <div class="s-section" style="padding-bottom:6px">
        <div class="s-title">Obstacle Data</div>
      </div>
      <div class="flex-container1">
        <div class="step-text" style="padding-top:6px; padding-bottom:6px">
          <label for="Elevation Unit" style="margin-left:10px;">Obstacle Elevation Unit:</label>
          <select class="step-text" name="elev" id="elev-label" onchange="updateTable()"
            style="border:0.5px solid var(--border);border-radius:var(--radius);padding:4px 6px;font-size:12px;background:var(--bg);color:var(--text);">
            <option value="ft">ft</option>
            <option value="m">m</option>
          </select>
        </div>
      </div>

      <div id="obs-table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>DER (m)</th>
              <th>Lat (m)</th>
              <th id="elev-table-label">Elev (ft)</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="obs-tbody"></tbody>
        </table>
        <div id="obs-empty" style="padding:16px;text-align:center;font-size:12px;color:var(--hint)">No obstacles placed
          yet</div>
      </div>

    </div>

    <!-- Canvas area -->
    <div id="canvas-area">
      <canvas id="main-canvas"></canvas>
      <div id="hint-bar">Upload a chart to begin</div>
      <div id="scale-badge" style="display:none"></div>
      <div id="coord-bar" style="display:none"></div>
    </div>
    <div id="zoom-controls">
      <button class="icon-btn" onclick="zoom(1.25)" title="Zoom in">+</button>
      <button class="icon-btn" onclick="zoom(0.8)" title="Zoom out">−</button>
      <button class="icon-btn" onclick="fitView()" title="Fit to screen" style="font-size:11px">⊡</button>
    </div>

  </div>

  <script>
    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d');
    const area = document.getElementById('canvas-area');

    // State
    let img = null;
    let zoomLevel = 1, panX = 0, panY = 0;
    let isPanning = false, panStart = null;
    let mode = 'calibrate';
    let calibPts = [], calibMpp = null;
    let runwayEnd = null;
    let obstacles = [], obsCount = 0;
    let hoverPt = null;

    // Colors
    const C = {
      blue: '#378ADD', blueD: '#0C447C',
      green: '#1D9E75', greenD: '#085041',
      amber: '#EF9F27', amberD: '#633806',
      red: '#D85A30', redD: '#712B13',
      white: '#ffffff',
    };

    // ── File loading ──────────────────────────────────────────────
    function loadChart(e) {
      const file = e.target.files[0];
      if (!file) return;
      loadImageFile(file);
    }

    /*
    function onDrop(e) {
      e.preventDefault();
      document.getElementById('upload-zone').classList.remove('drag');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) loadImageFile(file);
    } */

    function loadImageFile(file) {
      const reader = new FileReader();
      reader.onload = ev => {
        const image = new Image();
        image.onload = () => {
          img = image;
          canvas.width = image.naturalWidth;
          canvas.height = image.naturalHeight;
          fitView();
          //enableUI();
          document.getElementById('to-dir').disabled = false;
          document.getElementById('btn-confirm-dir').disabled = false;
          document.getElementById('btn-confirm-dir').classList.add('flash-bg');

          document.getElementById('chart-info').style.display = 'block';
          document.getElementById('chart-info').textContent =
            `${file.name} · ${image.naturalWidth}×${image.naturalHeight}px`;
          setMode('calibrate');
          setHint('Step 1: Click the start of a known distance on the scale bar');
          draw();
        };
        image.src = ev.target.result;
      };
      reader.readAsDataURL(file);
      disableUpload();
    }

    function disableUpload() {
      document.getElementById('btn-upload').classList.remove('flash-bg');
      document.getElementById('btn-upload').disabled = true
    }

    /*
    function enableUpload() {
      document.getElementById('btn-upload').classList.add('flash-bg');
      document.getElementById('btn-upload').disabled = false
    }
      */

    function enableUI() {
      ['btn-calib', 'btn-rwy', 'btn-obs', 'btn-export', 'to-dir', 'btn-confirm-dir'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.disabled = false;
      });
    }

    function disableUI() {
      ['btn-calib', 'btn-rwy', 'btn-obs', 'btn-export', 'to-dir', 'btn-confirm-dir'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.disabled = true;
      });
    }

    // ── View transform ────────────────────────────────────────────
    function fitView() {
      if (!img) return;
      /*if (mode === 'runway') {
        setHint('Click the end of the runway to continue');
        undoLast();
      }
      if (mode === 'obstacle') {
        undoLast();
        if (obstacles.length == 0) {
          setMode('runway');
        }
      }*/
      const W = area.clientWidth, H = area.clientHeight;
      zoomLevel = Math.min(W / img.naturalWidth, H / img.naturalHeight) * 0.95;
      panX = (W - img.naturalWidth * zoomLevel) / 2;
      panY = (H - img.naturalHeight * zoomLevel) / 2;
      applyTransform();
    }

    function zoom(factor) {
      const W = area.clientWidth, H = area.clientHeight;
      const cx = W / 2, cy = H / 2;
      panX = cx - (cx - panX) * factor;
      panY = cy - (cy - panY) * factor;
      zoomLevel *= factor;
      applyTransform();
    }

    function applyTransform() {
      canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
      draw();
    }

    // Canvas coords (image pixels) from screen coords
    function screenToCanvas(sx, sy) {
      return { x: (sx - panX) / zoomLevel, y: (sy - panY) / zoomLevel };
    }

    // ── Finalize takeoff direction ─────────────────────────────────
    function confirmDirection() {
      const select = document.getElementById('to-dir');
      const dir = select.value;
      if (dir === 'left') {
        // Default orientation is left takeoff, so no change needed
        setHint('Takeoff direction confirmed as LEFT. Proceed to calibration.');
      } else {
        setHint('Takeoff direction confirmed as RIGHT. Proceed to calibration.');
      }
      document.getElementById('to-dir').disabled = true;
      document.getElementById('btn-confirm-dir').disabled = true;
      document.getElementById('btn-confirm-dir').classList.remove('flash-bg');

      document.getElementById('btn-calib').disabled = false;
      document.getElementById('btn-calib').classList.add('flash-bg');
    }

    // ── Mouse events ──────────────────────────────────────────────
    area.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.12 : 0.89;
      const rect = area.getBoundingClientRect();
      const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
      panX = sx - (sx - panX) * factor;
      panY = sy - (sy - panY) * factor;
      zoomLevel *= factor;
      applyTransform();
    }, { passive: false });

    area.addEventListener('mousedown', e => {
      if (e.button === 1 || (e.button === 0 && e.altKey)) {
        isPanning = true;
        panStart = { x: e.clientX - panX, y: e.clientY - panY };
        canvas.classList.add('grabbing');
        e.preventDefault();
      }
    });

    area.addEventListener('mousemove', e => {
      const rect = area.getBoundingClientRect();
      const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
      hoverPt = screenToCanvas(sx, sy);

      if (isPanning) {
        panX = e.clientX - panStart.x;
        panY = e.clientY - panStart.y;
        applyTransform();
        return;
      }

      // Update coord bar
      if (img) {
        document.getElementById('coord-bar').style.display = 'block';
        document.getElementById('coord-bar').textContent =
          `x: ${Math.round(hoverPt.x)}  y: ${Math.round(hoverPt.y)}`;
      }

      // Live measurement preview
      /*if (runwayEnd && mode === 'obstacle' && calibMpp) {
        const m = measure(hoverPt);
        document.getElementById('s-long').textContent = m.long + ' m';
        document.getElementById('s-lat').textContent  = m.lat  + ' m';
        document.getElementById('s-dist').textContent = m.dist + ' m';
      } */

      // Live calibration line
      if (mode === 'calibrate' && calibPts.length === 1) draw();
    });

    area.addEventListener('mouseup', e => {
      if (isPanning) { isPanning = false; canvas.classList.remove('grabbing'); }
    });

    area.addEventListener('mouseleave', () => { hoverPt = null; draw(); });

    area.addEventListener('click', e => {
      if (isPanning || e.altKey) return;
      const rect = area.getBoundingClientRect();
      const pt = screenToCanvas(e.clientX - rect.left, e.clientY - rect.top);
      handleClick(pt);
    });

    function handleClick(pt) {
      if (!img) return;

      if (pt.x < 0 || pt.y < 0 || pt.x > img.naturalWidth || pt.y > img.naturalHeight) {
        setHint('Click is outside the chart area');
        return;
      }

      if (mode === 'calibrate') {
        calibPts.push(pt);
        if (calibPts.length === 2) finishCalibration();
        else setHint('Now click the END of the known distance');
        draw(); return;
      }

      if (mode === 'runway') {
        runwayEnd = pt;
        document.getElementById('btn-obs').disabled = false;
        setHint('Runway end set. Switch to "Place obstacle" and click each obstacle.');
        document.getElementById('step1-num').className = 'step-num done';
        draw(); setMode('obstacle'); return;
      }

      if (mode === 'obstacle') {
        if (!runwayEnd) { setHint('Set the runway end first'); return; }
        obsCount++;
        //const { x: x_new, y: y_new } = checkRunwayDirection(pt);
        //x_new = pt.x
        //y_new = pt.y
        //console.log("New obstacle at: ", x_new, y_new);
        obstacles.push({ id: obsCount, uid: 'u' + Date.now(), x: pt.x, y: pt.y, elev: '' });
        //document.getElementById('s-count').textContent = obstacles.length;
        document.getElementById('btn-export').disabled = false;
        document.getElementById('downloadBtn').disabled = false;
        updateTable();
        setHint(`Obstacle ${obsCount} placed — continue clicking or export when done`);
        draw();
      }
    }

    // ── Calibration ───────────────────────────────────────────────
    function finishCalibration() {
      const dist = parseFloat(document.getElementById('calib-dist').value) || 1000;
      const unit = document.getElementById('calib-unit').value;
      const distM = unit === 'ft' ? dist * 0.3048 : unit === 'nm' ? dist * 1852 : dist;
      const dx = calibPts[1].x - calibPts[0].x;
      const dy = calibPts[1].y - calibPts[0].y;
      const px = Math.sqrt(dx * dx + dy * dy);
      calibMpp = distM / px;

      //const badge = document.getElementById('scale-badge');
      //badge.style.display = 'block';
      //badge.textContent = `Scale: ${calibMpp.toFixed(4)} m/px`;

      //const res = document.getElementById('calib-result');
      //res.style.display = 'block';
      //res.textContent = `✓ ${dist} ${unit} = ${Math.round(px)} px → ${calibMpp.toFixed(4)} m/px`;

      document.getElementById('btn-rwy').disabled = false;
      document.getElementById('btn-calib').disabled = true;
      document.getElementById('calib-unit').disabled = true;
      document.getElementById('calib-dist').disabled = true;
      setHint('Calibrated. Now click "Set runway end" and click the runway threshold.');
      updateTable();
      document.getElementById('btn-calib').classList.remove('flash-bg');
      setMode('runway');
      document.getElementById('btn-rwy').classList.add('flash-bg');
    }

    function setMode(m) {
      mode = m;
      if (m === 'calibrate') { calibPts = []; document.getElementById('calib-result').style.display = 'none'; calibMpp = null; document.getElementById('scale-badge').style.display = 'none'; }
      ['btn-calib', 'btn-rwy', 'btn-obs'].forEach(id => document.getElementById(id).classList.remove('active'));
      const map = { calibrate: 'btn-calib', runway: 'btn-rwy', obstacle: 'btn-obs' };
      document.getElementById(map[m]).classList.add('active');

      const hints = {
        calibrate: 'Click the START of a known distance on the scale bar',
        runway: 'Click the runway threshold — the end of runway closest to approach',
        obstacle: runwayEnd ? 'Click to place each obstacle on the chart' : 'Set runway end first'
      };
      setHint(hints[m]);
      draw();
    }

    // ── Verify Lateral and DER ────────────────────────────────────
    function checkRunwayDirection(x, y) {
      if (!runwayEnd || !calibMpp) return false;
      direction = document.getElementById('to-dir').value

      if (direction == "left") {
        x = x * -1;
        y = y * -1;
      }
      return [x, y];
    }

    // ── Measurement ───────────────────────────────────────────────
    function measure(pt) {
      if (!runwayEnd || !calibMpp) return { long: 0, lat: 0, dist: 0 };

      //const { x: x_new, y: y_new } = checkRunwayDirection(pt);
      const x = pt.x - runwayEnd.x;
      const y = pt.y - runwayEnd.y;

      const [dxPx, dyPx] = checkRunwayDirection(x, y);

      //console.log("dxPx, dyPx: ", dxPx, dyPx);

      return {
        long: Math.round(dxPx * calibMpp),
        lat: Math.round(dyPx * calibMpp),
        dist: Math.round(Math.sqrt(dxPx * dxPx + dyPx * dyPx) * calibMpp)
      };
    }

    // ── Drawing ───────────────────────────────────────────────────
    function draw() {
      if (!img) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);

      const showDims = document.getElementById('tog-dims').checked;
      const showLabels = document.getElementById('tog-labels').checked;
      const showIds = document.getElementById('tog-ids').checked;

      // Calibration points & line
      if (calibPts.length > 0 && calibPts.length <= 2) {
        calibPts.forEach((p, i) => {
          drawMarker(p.x, p.y, C.amber, i === 0 ? 'A' : 'B', 6);
        });
        if (calibPts.length === 2) {
          drawDashedLine(calibPts[0].x, calibPts[0].y, calibPts[1].x, calibPts[1].y, C.amber, 1.5);
          const mx = (calibPts[0].x + calibPts[1].x) / 2;
          const my = (calibPts[0].y + calibPts[1].y) / 2 - 8;
          drawLabel(mx, my, `${document.getElementById('calib-dist').value} ${document.getElementById('calib-unit').value}`, C.amber);
        }
        if (calibPts.length === 1 && hoverPt && mode === 'calibrate') {
          drawDashedLine(calibPts[0].x, calibPts[0].y, hoverPt.x, hoverPt.y, C.amber, 0.8);
        }
      }

      // Runway end
      if (runwayEnd) {
        const { x, y } = runwayEnd;
        ctx.strokeStyle = C.blue; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x - 14, y); ctx.lineTo(x + 14, y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x, y - 14); ctx.lineTo(x, y + 14); ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fillStyle = C.blue; ctx.fill();
        drawLabel(x + 12, y - 10, 'RWY end', C.blue);
        document.getElementById('btn-rwy').classList.remove('flash-bg');
      }

      // Obstacles
      obstacles.forEach(o => {
        if (showDims && runwayEnd) {
          drawDashedLine(runwayEnd.x, runwayEnd.y, o.x, runwayEnd.y, C.green, 0.8);
          drawDashedLine(o.x, runwayEnd.y, o.x, o.y, C.green, 0.8);
          if (showLabels && calibMpp) {
            const m = measure(o);
            drawLabel((runwayEnd.x + o.x) / 2, runwayEnd.y - 9, m.long + 'm', C.greenD);
            drawLabel(o.x + 5, (runwayEnd.y + o.y) / 2, m.lat + 'm', C.greenD);
          }
        }
        const r = 7;
        ctx.strokeStyle = C.red; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(o.x - r, o.y - r); ctx.lineTo(o.x + r, o.y + r); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(o.x + r, o.y - r); ctx.lineTo(o.x - r, o.y + r); ctx.stroke();
        if (showIds) drawBadge(o.x + 9, o.y - 9, String(o.id), C.red);
        if (o.elev) drawLabel(o.x + 9, o.y + 12, o.elev, C.redD);
      });

      // Hover preview line
      if (hoverPt && mode === 'obstacle' && runwayEnd) {
        ctx.strokeStyle = 'rgba(215,90,48,0.3)'; ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.arc(hoverPt.x, hoverPt.y, 9, 0, Math.PI * 2); ctx.stroke();
        if (showDims) {
          drawDashedLine(runwayEnd.x, runwayEnd.y, hoverPt.x, runwayEnd.y, 'rgba(29,158,117,0.35)', 0.6);
          drawDashedLine(hoverPt.x, runwayEnd.y, hoverPt.x, hoverPt.y, 'rgba(29,158,117,0.35)', 0.6);
        }
      }
    }

    function drawMarker(x, y, color, label, r) {
      ctx.strokeStyle = color; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = color; ctx.font = 'bold 11px system-ui';
      ctx.fillText(label, x + r + 3, y + 4);
    }

    function drawDashedLine(x1, y1, x2, y2, color, width) {
      ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = width;
      ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
    }

    function drawLabel(x, y, text, color) {
      ctx.font = '11px system-ui';
      const w = ctx.measureText(text).width;
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(x - 2, y - 11, w + 4, 14);
      ctx.fillStyle = color;
      ctx.fillText(text, x, y);
    }

    function drawBadge(x, y, text, color) {
      ctx.font = 'bold 10px system-ui';
      const w = ctx.measureText(text).width + 8;
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.roundRect(x, y - 10, w, 14, 4); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText(text, x + 4, y + 1);
    }

    // ── Table ─────────────────────────────────────────────────────
    function updateTable() {
      const tbody = document.getElementById('obs-tbody');
      const empty = document.getElementById('obs-empty');

      //console.log("tbody: ", tbody);
      //console.log("empty: ", empty);

      tbody.innerHTML = '';
      empty.style.display = obstacles.length ? 'none' : 'block';

      document.getElementById("elev-table-label").innerText = "Elev (" + document.getElementById("elev-label").value + ")";
      //console.log(document.getElementById("elev-table-label").innerText);

      console.log("obstacles: ", obstacles)

      //console.log("calibMpp", calibMpp)
      //console.log("runwayEnd", runwayEnd)

      obstacles.forEach(o => {
        const m = calibMpp && runwayEnd ? measure(o) : { long: '—', lat: '—', dist: '—' };
        const tr = document.createElement('tr');
        tr.innerHTML = `
      <td><span class="obs-id">${o.id}</span></td>
      <td>${m.long}${typeof m.long === 'number' ? ' m' : ''}</td>
      <td>${m.lat}${typeof m.lat === 'number' ? ' m' : ''}</td>
      <td>${m.dist}${typeof m.dist === 'number' ? ' m' : ''}</td>
      <td><input type="text" value="${o.elev}" placeholder="Enter elev" oninput="obstacles.find(x=>x.uid==='${o.uid}').elev=this.value;draw()"></td>
      <td><button class="icon-btn" title="Delete" onclick="deleteObs('${o.uid}')" style="font-size:12px" aria-label="Delete">×</button></td>`;
        tbody.appendChild(tr);
      });
      console.log("tbody", tbody)
      //document.getElementById('s-count').textContent = obstacles.length;
    }

    function deleteObs(uid) {
      obstacles = obstacles.filter(o => o.uid !== uid);
      updateTable(); draw(); obsCount--;
    }

    function undoLast() {
      if (mode === 'calibrate' && calibPts.length > 0) {
        calibPts.pop(); draw(); return;
      }
      // Added obsCount-- to ensure IDs remain sequential after undoing, but this means IDs can be reused if you undo and add again. 
      // A more robust solution would be to generate unique IDs that aren't tied to count, but for simplicity we'll keep it as is.
      if (obstacles.length > 0) { obsCount--; obstacles.pop(); updateTable(); draw(); }
      else if (runwayEnd) { runwayEnd = null; draw(); }
    }

    // ── Export Data ───────────────────────────────────────────────
    function exportCSV() {
      elev_unit = document.getElementById('elev-label').value;
      let csv = 'obstacle_id,DER_m,lateral_m,elevation_' + elev_unit + '\n';
      obstacles.forEach(o => {
        const m = calibMpp && runwayEnd ? measure(o) : { long: '', lat: '', dist: '' };
        csv += `${o.id},${m.long},${m.lat},"${o.elev}"\n`;
      });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      a.download = 'aoc_obstacles.csv'; a.click();
    }

    // ── Export Image ──────────────────────────────────────────────
    function exportCanvas() {
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);

        const link = document.createElement('a');
        link.download = 'aoc_obstacles_overlay.png';
        link.href = url;
        link.click();

        URL.revokeObjectURL(url);
      }, 'image/png');
    }

    // ── Reset ─────────────────────────────────────────────────────
    function resetAll() {
      if (!confirm('Reset all measurements? The chart image will be kept.')) return;
      calibPts = []; calibMpp = null; runwayEnd = null;
      obstacles = []; obsCount = 0;

      document.getElementById('calib-result').style.display = 'none';
      document.getElementById('scale-badge').style.display = 'none';
      document.getElementById('coord-bar').style.display = 'none';
      document.getElementById('obs-tbody').style.display = '';
      document.getElementById('obs-empty').style.display = 'No obstacles placed yet';

      document.getElementById('to-dir').disabled = false;
      document.getElementById('btn-confirm-dir').disabled = false;
      document.getElementById('btn-rwy').disabled = true;
      document.getElementById('btn-obs').disabled = true;
      document.getElementById('btn-export').disabled = true;
      document.getElementById('downloadBtn').disabled = true;
      document.getElementById('calib-dist').disabled = false
      document.getElementById('calib-unit').disabled = false

      document.getElementById('btn-confirm-dir').classList.add('flash-bg');
      document.getElementById('btn-upload').disabled = false

      //['s-long','s-lat','s-dist'].forEach(id => document.getElementById(id).textContent = '—');
      //document.getElementById('s-count').textContent = '0';
      //enableUpload()
      updateTable();
      //disableUI();
      //setMode('runway');
      if (img) { setMode('calibrate'); draw(); }
      else setHint('Upload a chart to begin');
    }

    // ── Hint ──────────────────────────────────────────────────────
    function setHint(msg) { document.getElementById('hint-bar').textContent = msg; }

    // Init
    window.addEventListener('resize', () => { if (img) fitView(); });

    window.addEventListener('pagehide', function () {
        navigator.sendBeacon('/shutdown');
    });
  </script>
