<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AOC Obstacle Measurement Tool</title>
  <script type=text/javascript src="{{url_for('static', filename='js/main.js')}}" defer></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --border: rgba(0, 0, 0, 0.12);
      --text: #1a1a18;
      --muted: #6b6b66;
      --hint: #9b9b96;
      --blue: #185FA5;
      --blue-bg: #E6F1FB;
      --blue-text: #0C447C;
      --green: #0F6E56;
      --green-bg: #E1F5EE;
      --green-text: #085041;
      --amber: #854F0B;
      --amber-bg: #FAEEDA;
      --amber-text: #633806;
      --red: #993C1D;
      --red-bg: #FAECE7;
      --red-text: #712B13;
      --radius: 8px;
      --radius-lg: 12px;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Layout */
    #app {
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: 48px 1fr;
      height: 100vh;
    }

    #topbar {
      grid-column: 1/-1;
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
    }

    #sidebar {
      background: var(--surface);
      border-right: 0.5px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    #canvas-area {
      position: relative;
      overflow: hidden;
      background: #2a2a28;
    }

    /* Topbar */
    #topbar h1 {
      font-size: 14px;
      font-weight: 500;
    }

    #topbar .sep {
      width: 0.5px;
      height: 20px;
      background: var(--border);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 400;
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.1s;
    }

    .btn:hover {
      background: var(--bg);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn.primary {
      background: var(--blue-bg);
      color: var(--blue-text);
      border-color: rgba(24, 95, 165, 0.3);
    }

    .btn.active {
      background: var(--blue-bg);
      color: var(--blue-text);
      border-color: var(--blue);
      font-weight: 500;
    }

    .btn.success {
      background: var(--green-bg);
      color: var(--green-text);
      border-color: rgba(15, 110, 86, 0.3);
    }

    .btn.danger {
      background: var(--red-bg);
      color: var(--red-text);
      border-color: rgba(153, 60, 29, 0.3);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer;
      font-size: 14px;
      color: var(--muted);
    }

    .icon-btn:hover {
      background: var(--bg);
      color: var(--text);
    }

    /* Sidebar sections */
    .s-section {
      padding: 12px 14px;
      border-bottom: 0.5px solid var(--border);
    }

    .s-title {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    /* Upload zone */
    /*#upload-zone { border: 1.5px dashed var(--border); border-radius: var(--radius-lg); padding: 20px 12px; text-align: center; cursor: pointer; transition: all 0.15s; }
  #upload-zone:hover, #upload-zone.drag { border-color: var(--blue); background: var(--blue-bg); }
  #upload-zone svg { display: block; margin: 0 auto 8px; color: var(--hint); }
  #upload-zone p { font-size: 12px; color: var(--muted); }
  #upload-zone .sub { font-size: 11px; color: var(--hint); margin-top: 2px; }
  #file-input { display: none; }
*/

    /* Calibration */
    .calib-step {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 0;
    }

    .step-num {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--amber-bg);
      color: var(--amber-text);
      font-size: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .step-num.done {
      background: var(--green-bg);
      color: var(--green-text);
    }

    .step-text {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    /* Mode buttons */
    .mode-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* Stats */
    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .stat-card {
      background: var(--bg);
      border-radius: var(--radius);
      padding: 8px 10px;
    }

    .stat-card .label {
      font-size: 10px;
      color: var(--hint);
    }

    .stat-card .val {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      margin-top: 1px;
    }

    /* Obstacle table */
    #obs-table-wrap {
      flex: 1;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th {
      padding: 6px 8px;
      text-align: left;
      font-weight: 400;
      color: var(--muted);
      border-bottom: 0.5px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--surface);
      font-size: 11px;
    }

    td {
      padding: 5px 8px;
      border-bottom: 0.5px solid var(--border);
    }

    td input {
      width: 60px;
      border: 0.5px solid var(--border);
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 11px;
      background: var(--bg);
      color: var(--text);
    }

    td input:focus {
      outline: none;
      border-color: var(--blue);
    }

    tbody tr:hover {
      background: var(--bg);
    }

    .obs-id {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--red-bg);
      color: var(--red-text);
      font-size: 10px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Hint bar */
    #hint-bar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(26, 26, 24, 0.82);
      color: #fff;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
      backdrop-filter: blur(4px);
      transition: opacity 0.2s;
    }

    /* Zoom controls */
    #zoom-controls {
      position: absolute;
      bottom: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
    }

    /* Canvas cursor states */
    #main-canvas {
      display: block;
      cursor: crosshair;
      transform-origin: 0 0;
    }

    #main-canvas.grab {
      cursor: grab;
    }

    #main-canvas.grabbing {
      cursor: grabbing;
    }

    /* Scale badge */
    #scale-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(26, 26, 24, 0.7);
      color: #fff;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      pointer-events: none;
      z-index: 10;
    }

    /* Coord display */
    #coord-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(26, 26, 24, 0.7);
      color: #fff;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      pointer-events: none;
      z-index: 10;
    }

    /* Toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 12px;
    }

    .toggle {
      position: relative;
      width: 28px;
      height: 16px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle input:checked+.toggle-track {
      background: var(--blue);
    }

    .toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
      pointer-events: none;
    }

    .toggle input:checked~.toggle-thumb {
      transform: translateX(12px);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .flex-container1 {
      display: flex;
      /* Aligns items side by side */
      gap: 20px;
      /* Adds space between the two divs */
    }

    .box1 {
      flex: 1;
      /* Forces both divs to take up equal width */
      padding: 15px;
      background-color: #f0f0f0;
    }

    .flash-bg {
      cursor: pointer;
      animation: flashBackground 1s infinite linear;
    }

    @keyframes flashBackground {

      0%,
      100% {
        background-color: #f5f4f0;
      }

      50% {
        background-color: #EED202;
      }
    }
  </style>
</head>

<body>
  <div id="app">

    <!-- Top bar -->
    <div id="topbar">
      <h1>AOC Obstacle Measurement Tool</h1>
      <div class="sep"></div>
      <button class="btn flash-bg" id="btn-upload" onclick="document.getElementById('file-input').click()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
        Upload chart
      </button>
      <input type="file" id="file-input" accept="image/*" onchange="loadChart(event)" style="display: none;">
      <div class="sep"></div>
      <button class="btn" id="btn-export" onclick="exportCSV()" disabled style="background:#90EE90">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        Export CSV
      </button>
      <button class="btn" id="downloadBtn" onclick="exportCanvas()" disabled style="background:#90EE90">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        Download Image
      </button>

      <input type="text" id="icao-input" placeholder="Enter ICAO code"
        style="margin-left:100px; border:0.5px solid var(--border);border-radius:var(--radius);padding:4px 6px;font-size:12px;background:var(--bg);color:var(--text);">

      <input type="text" id="rwy-input" placeholder="Enter RWY #"
        style="margin-left:10px; border:0.5px solid var(--border);border-radius:var(--radius);padding:4px 6px;font-size:12px;background:var(--bg);color:var(--text);">
      
      <button class="btn danger" onclick="resetAll()" style="margin-left:auto">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="1 4 1 10 7 10" />
          <path d="M3.51 15a9 9 0 102.13-9.36L1 10" />
        </svg>
        Reset
      </button>
    </div>
    <!-- Sidebar -->
    <div id="sidebar">
      <!-- Upload -->
      <!-- 
    <div class="s-section">
      <div class="s-title"></div>
      <div id="upload-zone"
        onclick="document.getElementById('file-input').click()"
        ondragover="e=>{ e.preventDefault(); this.classList.add('drag')}"
        ondragleave="this.classList.remove('drag')"
        ondrop="onDrop(event)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <p>Drop or click to upload</p>
        <p class="sub">PNG · JPG · Plan or profile view</p>
      </div>
      <div id="chart-info" style="display:none;margin-top:8px;font-size:11px;color:var(--muted);"></div>
    </div>
    -->
      <div class="s-section">
        <div class="s-title">Confirm takeoff direction</div>
        <div class="flex-container1">
          <div class="step-text" style="padding-top:6px; padding-bottom:6px">
            <label for="Takeoff Direction" style="margin-left:10px; ">Takeoff Direction:</label>
            <select class="step-text" name="to-dir" id="to-dir" disabled
              style="border:0.5px solid var(--border);border-radius:var(--radius);padding:4px 6px;font-size:12px;background:var(--bg);color:var(--text);">
              <option value="left">Left</option>
              <option value="right">Right </option>
            </select>
            <button class="btn active" id="btn-confirm-dir" disabled onclick="confirmDirection()">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="5" y1="12" x2="19" y2="12" />
                <line x1="5" y1="5" x2="5" y2="19" />
                <line x1="19" y1="5" x2="19" y2="19" />
              </svg>
              Confirm
            </button>
          </div>
        </div>
      </div>

      <!-- Calibration -->
      <div class="s-section">
        <div class="flex-container1">
          <div class="s-title">Scale calibration</div>
          <div title="Click the start and end of a known distance on the printed scale bar." class="step-num"
            id="step1-num">i</div>
        </div>
        <div class="calib-step">
          <div>
            <!--<div style="font-size:12px;font-weight:500;margin-bottom:2px">Click two scale bar points</div> -->
            <div class="step-text" title="Click the start and end of a known distance on the printed scale bar.">
              Calibrate to begin.</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin:6px 0 4px;padding-left:26px;">
          <input type="number" id="calib-dist" value="1000" min="1" step="1"
            style="width:70px;border:0.5px solid var(--border);border-radius:var(--radius);padding:4px 7px;font-size:12px;background:var(--bg);color:var(--text);">
          <select id="calib-unit"
            style="border:0.5px solid var(--border);border-radius:var(--radius);padding:4px 6px;font-size:12px;background:var(--bg);color:var(--text);">
            <option value="m">metres</option>
            <option value="ft">feet</option>
            <option value="nm">NM</option>
          </select>
        </div>
        <div style="padding-left:10px;">
          <button class="btn active" id="btn-calib" onclick="setMode('calibrate')" disabled>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12" />
              <line x1="5" y1="5" x2="5" y2="19" />
              <line x1="19" y1="5" x2="19" y2="19" />
            </svg>
            Calibrate
          </button>
        </div>
        <div id="calib-result"
          style="display:none;margin-top:8px;padding:6px 10px;background:var(--green-bg);border-radius:var(--radius);font-size:11px;color:var(--green-text);padding-left:26px;margin-left:0;">
        </div>
      </div>

      <!-- Measurement mode -->
      <div class="s-section">
        <div class="s-title">Measurement</div>
        <div class="mode-group">
          <button class="btn" id="btn-rwy" onclick="setMode('runway')" disabled>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 20L20 4" />
              <path d="M20 4h-6" />
              <path d="M20 4v6" />
            </svg>
            Set runway end
          </button>
          <button class="btn" id="btn-obs" onclick="setMode('obstacle')" disabled>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="10" r="3" />
              <path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 10-16 0c0 3 2.7 6.9 8 11.7z" />
            </svg>
            Place obstacle
          </button>
          <button class="btn" onclick="undoLast()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 14 4 9 9 4" />
              <path d="M20 20v-7a4 4 0 00-4-4H4" />
            </svg>
            Undo last
          </button>
        </div>
      </div>

      <!-- Display toggles -->
      <div class="s-section">
        <div class="s-title">Display Options</div>
        <div class="toggle-row">
          <span>Dimension lines</span>
          <label class="toggle"><input type="checkbox" id="tog-dims" checked onchange="draw()">
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
          </label>
        </div>
        <div class="toggle-row">
          <span>Distance labels</span>
          <label class="toggle"><input type="checkbox" id="tog-labels" checked onchange="draw()">
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
          </label>
        </div>
        <div class="toggle-row">
          <span>Obstacle IDs</span>
          <label class="toggle"><input type="checkbox" id="tog-ids" checked onchange="draw()">
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
          </label>
        </div>
      </div>

      <!-- Obstacle Table -->
      <div class="s-section" style="padding-bottom:6px">
        <div class="s-title">Obstacle Data</div>
      </div>
      <div class="flex-container1">
        <div class="step-text" style="padding-top:6px; padding-bottom:6px">
          <label for="Elevation Unit" style="margin-left:10px;">Obstacle Elevation Unit:</label>
          <select class="step-text" name="elev" id="elev-label" onchange="updateTable()"
            style="border:0.5px solid var(--border);border-radius:var(--radius);padding:4px 6px;font-size:12px;background:var(--bg);color:var(--text);">
            <option value="ft">ft</option>
            <option value="m">m</option>
          </select>
        </div>
      </div>

      <div id="obs-table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>DER (m)</th>
              <th>Lat (m)</th>
              <th id="elev-table-label">Elev (ft)</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="obs-tbody"></tbody>
        </table>
        <div id="obs-empty" style="padding:16px;text-align:center;font-size:12px;color:var(--hint)">No obstacles placed
          yet</div>
      </div>

    </div>

    <!-- Canvas area -->
    <div id="canvas-area">
      <canvas id="main-canvas"></canvas>
      <div id="hint-bar">Upload a chart to begin</div>
      <div id="scale-badge" style="display:none"></div>
      <div id="coord-bar" style="display:none"></div>
    </div>
    <div id="zoom-controls">
      <button class="icon-btn" onclick="zoom(1.25)" title="Zoom in">+</button>
      <button class="icon-btn" onclick="zoom(0.8)" title="Zoom out">−</button>
      <button class="icon-btn" onclick="fitView()" title="Fit to screen" style="font-size:11px">⊡</button>
    </div>
  </div>
</body>
</html>
