{% extends "base.html" %}

{% block body %}
    <div id="app-image-selector">
        <div id="topbar">
            <h1>Vectis (v2.0.1)</h1>
            <div class="sep"></div>
            Set Zoom Level:
            <!-- Live dynamic numeric feedback -->
            <div class="value-display" id="output">3.0</div>
            <div class="scale-container">
                <div class="slider-wrapper">
                    <!-- Native HTML range element sets the min, max, and starting index -->
                    <input type="range" min="1.1" max="5.0" value="3.0" step="0.1" class="scale-slider" id="scale">
                    <!-- Structural placeholder for custom JavaScript tick lines -->
                    <div class="scale-ticks" id="ticks-container"></div>
                </div>
            </div>
            <div class="sep"></div>
            <div>
                <button class="btn flash-bg" id="btn-upload" onclick="document.getElementById('file-input').click()">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
                        <polyline points="17 8 12 3 7 8" />
                        <line x1="12" y1="3" x2="12" y2="15" />
                    </svg>
                    Upload chart
                </button>
                <input type="file" id="file-input" accept="image/*, application/pdf" onchange="loadChart(event)" style="display: none;">
            </div>
        </div>
        <div class="gallery-spacing">
            <div class="image-container">
                <div>
                    <div id="gallery"></div>
                </div>
            </div>
        </div>
        <div id="hint-bar">Upload a chart to begin</div>
    </div> 
{% endblock body %}

{% block javascript %}
    <script src="{{ url_for('static',filename='js/fileloader.js') }}"></script>
    <script>
        const slider = document.getElementById('scale');
        const output = document.getElementById('output');
        const ticksContainer = document.getElementById('ticks-container');

        // Dynamic tick generator setup
        const min = parseInt(slider.min);
        const max = parseInt(slider.max);
        const step = 25; // Places a custom tick mark label every 25 units

        for (let i = min; i <= max; i += step) {
            const tick = document.createElement('div');
            tick.classList.add('tick');
            tick.setAttribute('data-value', i);
            ticksContainer.appendChild(tick);
        }

        // Live updating listener event triggers during the active dragging process
        slider.addEventListener('input', (e) => {
            output.textContent = e.target.value;
        });</script>
{% endblock javascript %}
